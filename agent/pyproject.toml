[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "psutil>=6.1.0",
    "httpx>=0.28.0",
    "watchdog>=6.0.0",
    "pydantic-settings>=2.7.0",
    "pywin32>=308; sys_platform == 'win32'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
